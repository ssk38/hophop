　<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hophop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div id="score">SCORE 0</div>
        <div id="best">BEST 0</div>
        <div id="lives">LIVES 3</div>
      </div>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Hophop mini game"></canvas>

      <div id="overlay" class="overlay visible">
        <div id="mainPanel" class="panel">
          <h1 id="overlayTitle">HOPHOP</h1>
          <p id="overlayMessage">Press Space or click to start</p>
          <div class="panel-actions">
            <button id="playBtn" type="button">Start</button>
            <button id="leaderboardBtn" class="secondary-button" type="button">TOP 10</button>
          </div>
        </div>

        <section id="leaderboardPanel" class="panel leaderboard-panel" aria-labelledby="leaderboardTitle" hidden>
          <h1 id="leaderboardTitle">TOP 10</h1>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
          <button id="leaderboardBackBtn" class="secondary-button" type="button">戻る</button>
        </section>
      </div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
